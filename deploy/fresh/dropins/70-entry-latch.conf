# desk-entry-latch-managed v1
# Rendered by `tools.ops.fresh_start render-units`; install as
# /etc/systemd/system/desk-paper-entry-dispatcher.service.d/70-entry-latch.conf BEFORE enabling the entry timer.
# Paper only; no provider requests. ExecStartPre blocks an entry tick (non-zero exit) if a BUY exists but the
# latch could not be applied; ExecStartPost latches right after the entry that produced the first BUY.
# Exit 0 means nothing to do or already latched. `tools.ops.cutover rollback` removes this file (marker above).
[Service]
ExecStartPre=/opt/solana-desk/.venv/bin/python -m tools.ops.entry_latch --apply --config <CONFIG> --ledger <FRESH_ROOT>/paper-ledger.sqlite
ExecStartPost=/opt/solana-desk/.venv/bin/python -m tools.ops.entry_latch --apply --config <CONFIG> --ledger <FRESH_ROOT>/paper-ledger.sqlite
