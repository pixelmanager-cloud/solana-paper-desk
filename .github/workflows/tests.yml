name: Lean tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-live.txt
      # the live paper trader (lean/) — fast signal on every push (~30 s locally)
      - run: python -m unittest discover -s tests/lean -t .
